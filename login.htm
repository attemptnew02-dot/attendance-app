
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>Admin Login | Attendance App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f7ef, #f5f8fc);
      color: #183b30;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 12px 40px rgba(0, 70, 45, 0.12);
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #087f5b;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7c75;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 27px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d6e2dc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f5b;
      box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.10);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #a61b1b;
    }

    .success {
      display: block !important;
      background: #e8f7ef;
      color: #087044;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #87948e;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">GHSS</div>

    <h1>Admin Login</h1>
    <p class="subtitle">
      12 Class Attendance Management System
    </p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input
        id="email"
        type="email"
        placeholder="Enter your admin email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Login
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="footer">
      Secure Admin Access
    </p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZtKB8k3AgNZFN1OgmD7E3YG-eBLmFXho",
      authDomain: "attendance-app-49e61.firebaseapp.com",
      projectId: "attendance-app-49e61",
      storageBucket: "attendance-app-49e61.firebasestorage.app",
      messagingSenderId: "740101602702",
      appId: "1:740101602702:web:9ce69345cf8ce5b42378df"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Logging in...";
      message.className = "";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);

        showMessage("Login successful! Opening Attendance App...", "success");

        // Temporary: replace with the real attendance page after
        // its authentication and security rules are integrated.
        window.location.href = "./index.html";

      } catch (error) {
        let errorText = "Login failed. Please check your email and password.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {
          errorText = "Email or password is incorrect.";
        } else if (error.code === "auth/too-many-requests") {
          errorText = "Too many attempts. Please try again later.";
        } else if (
          error.code === "auth/network-request-failed"
        ) {
          errorText = "Internet connection failed. Please try again.";
        } else if (
          error.code === "auth/operation-not-allowed"
        ) {
          errorText = "Enable Email/Password in Firebase Authentication.";
        }

        showMessage(errorText, "error");
        button.disabled = false;
        button.textContent = "Login";
      }
    });
  </script>
</body>
  </html>
